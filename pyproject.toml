[project]
name = "newspapercrawl-raw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "openpyxl>=3.1.5",
    "playwright>=1.40",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "pytest>=8.0.0",
]

[tool.ruff.lint]
# E4/E7/E9 与 F 为默认启用;补充启用 import 排序规则 I
extend-select = ["I"]
# ASYNC230: 一次性导入 CSV 用同步 open 更简洁,引入异步文件库属于过度设计
ignore = ["ASYNC230"]

[tool.pytest.ini_options]
# 项目未安装为包(uv sync --no-install-project),测试需从项目根导入 crawler
pythonpath = ["."]
